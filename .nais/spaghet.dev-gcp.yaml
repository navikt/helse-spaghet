spec:
  resources:
    limits:
      memory: 512Mi
    requests:
      memory: 64Mi
  replicas:
    max: 2
  kafka:
    pool: nav-dev
  azure:
    application:
      tenant: trygdeetaten.no
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        name: spaghet2
        tier: db-f1-micro
        databases:
          - name: spaghet
            envVarPrefix: DATABASE
            users:
              - name: bigquery_datastream
        flags:
          - name: cloudsql.logical_decoding
            value: 'on'
