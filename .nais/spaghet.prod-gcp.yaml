spec:
  preStopHook:
    http:
      path: /stop
  resources:
    limits:
      memory: 2048Mi
    requests:
      memory: 512Mi
  replicas:
    max: 12
  kafka:
    pool: nav-prod
  azure:
    application:
      tenant: nav.no
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        pointInTimeRecovery: true
        diskSize: 120
        diskType: SSD
        name: spaghet2
        tier: db-custom-4-16384
        databases:
          - name: spaghet
            envVarPrefix: DATABASE
            users:
              - name: bigquery_datastream
              - name: bigquery_connection_user
        flags:
          - name: cloudsql.logical_decoding
            value: 'on'
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
